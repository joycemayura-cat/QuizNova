<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>{{ quiz["title"] }} | QuizNova</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body class="quiz-page">


<nav class="navbar">

    <div class="logo">
        ⚡ QuizNova
    </div>

    <div class="quiz-nav">

        <span>
            👤 {{ session["student_name"] }}
        </span>

        <span class="timer-box">
            ⏱ <span id="timer">05:00</span>
        </span>

    </div>

</nav>


<div class="quiz-container">

    <div class="quiz-title">

        <div>

            <h1>{{ quiz["title"] }}</h1>

            <p>{{ quiz["description"] }}</p>

        </div>

        <div class="question-count">
            {{ questions|length }} Questions
        </div>

    </div>


    <form
        method="POST"
        id="quiz-form"
        onsubmit="return confirmSubmit()">


        {% for q in questions %}

        <div class="quiz-question">

            <div class="q-number">
                Question {{ loop.index }}
            </div>

            <h2>
                {{ q["question"] }}
            </h2>


            <div class="answer-options">

                <label>

                    <input
                        type="radio"
                        name="question_{{ q['id'] }}"
                        value="A"
                        required
                    >

                    <span>
                        <b>A</b>
                        {{ q["option_a"] }}
                    </span>

                </label>


                <label>

                    <input
                        type="radio"
                        name="question_{{ q['id'] }}"
                        value="B"
                    >

                    <span>
                        <b>B</b>
                        {{ q["option_b"] }}
                    </span>

                </label>


                <label>

                    <input
                        type="radio"
                        name="question_{{ q['id'] }}"
                        value="C"
                    >

                    <span>
                        <b>C</b>
                        {{ q["option_c"] }}
                    </span>

                </label>


                <label>

                    <input
                        type="radio"
                        name="question_{{ q['id'] }}"
                        value="D"
                    >

                    <span>
                        <b>D</b>
                        {{ q["option_d"] }}
                    </span>

                </label>

            </div>

        </div>

        {% endfor %}


        <button
            type="submit"
            class="btn primary submit-btn">

            🏆 Submit Quiz

        </button>

    </form>

</div>


<script>

let seconds = 300;

const timer =
    document.getElementById("timer");


const countdown = setInterval(() => {

    let minutes =
        Math.floor(seconds / 60);

    let secs =
        seconds % 60;

    timer.textContent =
        String(minutes).padStart(2, "0")
        + ":"
        + String(secs).padStart(2, "0");


    if (seconds <= 0) {

        clearInterval(countdown);

        document.getElementById(
            "quiz-form"
        ).submit();

    }

    seconds--;

}, 1000);


function confirmSubmit() {

    return confirm(
        "Are you sure you want to submit the quiz?"
    );

}

</script>

</body>
</html>
